[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "LicenseRef-AGL-1.1"
license-files = ["LICENSE", "LICENSES/LicenseRef-AL-1.1.txt"]
name = "cyberpulse"
version = "0.4.0"
description = "A retro-cyberpunk terminal hacking simulation game"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aegean-E", email = "aegean-licensing@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.scripts]
cyberpulse = "cyberpulse.cli:main"
